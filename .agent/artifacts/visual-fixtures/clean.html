<!doctype html><html><head><title>Clean Control</title><style>
body { font-family: sans-serif; margin: 24px; }
.row { display: flex; align-items: center; gap: 12px; width: 400px; border: 1px solid #ccc; padding: 12px; }
.item { background: #eef; padding: 12px; border-radius: 6px; }
.card { position: relative; width: 320px; border: 1px solid #ccc; padding: 24px; margin-top: 20px; }
.badge { position: absolute; top: 12px; right: 12px; background: #e33; color: #fff; padding: 4px 10px; border-radius: 12px; }
</style></head><body>
<h1>Clean control</h1>
<div class="row"><div class="item">A</div><div class="item">B</div><div class="item">C</div></div>
<div class="card"><span class="badge">NEW</span><p>Card content with the badge correctly placed inside the card bounds.</p></div>
</body></html>
